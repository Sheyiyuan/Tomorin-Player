name: Build & Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.13'
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.4.0
      - name: Install frontend dependencies
        run: make install
      - name: Quality checks
        run: make check

  build-linux-windows:
    needs: quality
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch tags
        run: git fetch --tags --force --prune

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22.x'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.13'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.4.0

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y jq dpkg-dev libgtk-3-dev libwebkit2gtk-4.1-dev nsis gcc-mingw-w64-x86-64 ruby ruby-dev rubygems rpm
          sudo gem install --no-document fpm -v 1.17.0

      - name: Install Wails CLI
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.11.0
          echo "$HOME/go/bin" >> $GITHUB_PATH
      - name: Derive version (tag -> release, main -> x.y.(z+1)-dev.date.hash)
        id: version
        run: |
          VERSION=$(bash scripts/derive-version.sh)
          echo "Final version: ${VERSION}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
      
      - name: Package Linux
        run: make package-linux VERSION='${{ steps.version.outputs.version }}'

      - name: Build Windows (cross-compile + NSIS)
        run: make package-windows VERSION='${{ steps.version.outputs.version }}' CLEAN=1

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: half-beat-${{ steps.version.outputs.version }}
          path: |
            build/deb/*.deb
            build/rpm/*.rpm
            build/bin/*.exe

  verify-linux-packages:
    needs: build-linux-windows
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Linux packages
        uses: actions/download-artifact@v4
        with:
          name: half-beat-${{ needs.build-linux-windows.outputs.version }}
          path: artifacts

      - name: Install packages on Debian and Fedora
        run: make verify-linux-packages ARTIFACT_ROOT=artifacts

  verify-windows-installer:
    needs: build-linux-windows
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Windows installer
        uses: actions/download-artifact@v4
        with:
          name: half-beat-${{ needs.build-linux-windows.outputs.version }}
          path: artifacts

      - name: Install, verify version, and uninstall
        shell: pwsh
        run: >-
          ./scripts/windows/smoke-test-installer.ps1
          -ArtifactRoot artifacts
          -ExpectedVersion '${{ needs.build-linux-windows.outputs.version }}'

  build-macos:
    needs: quality
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch tags
        run: git fetch --tags --force --prune

      - name: Derive version (tag -> release, main -> x.y.(z+1)-dev.date.hash)
        id: version
        run: |
          VERSION=$(bash scripts/derive-version.sh)
          echo "Final version: ${VERSION}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          # Go 1.24+ emits LC_UUID for internally linked Mach-O binaries.
          go-version: '1.24.x'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22.13'

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.4.0

      - name: Install tooling
        run: |
          brew install jq create-dmg

      - name: Install Wails CLI
        run: |
          go install github.com/wailsapp/wails/v2/cmd/wails@v2.11.0
          echo "$HOME/go/bin" >> $GITHUB_PATH

      - name: Verify Wails CLI Mach-O metadata
        run: |
          WAILS_BIN="$(go env GOPATH)/bin/wails"
          "$WAILS_BIN" version
          dwarfdump --uuid "$WAILS_BIN" | grep -q '^UUID:'

      - name: Build macOS (universal)
        run: make package-macos VERSION='${{ steps.version.outputs.version }}' CLEAN=1

      - name: Smoke test macOS GUI launch
        run: bash scripts/smoke-test-macos.sh build/bin/half-beat.app

      - name: Upload Artifacts (macOS)
        uses: actions/upload-artifact@v4
        with:
          name: half-beat-macos-${{ steps.version.outputs.version }}
          path: |
            build/bin/*.dmg

  release:
    needs: [verify-linux-packages, verify-windows-installer, build-macos]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch tags
        run: git fetch --tags --force --prune

      - name: Make scripts executable
        run: chmod +x scripts/derive-version.sh

      - name: Derive release metadata (tag -> release, main -> dev-latest)
        id: meta
        run: |
          VERSION=$(bash scripts/derive-version.sh)
          
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            TAG="${GITHUB_REF_NAME}"
            PRERELEASE=false
            NAME="Release ${VERSION}"
          else
            TAG="dev-latest"
            PRERELEASE=true
            NAME="Development Build ${VERSION}"
          fi
          
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "prerelease=${PRERELEASE}" >> "$GITHUB_OUTPUT"
          echo "name=${NAME}" >> "$GITHUB_OUTPUT"
          
          echo "Release metadata:"
          echo "  Version: ${VERSION}"
          echo "  Tag: ${TAG}"
          echo "  Prerelease: ${PRERELEASE}"
          echo "  Name: ${NAME}"

      - name: Remove previous dev release/tag
        if: ${{ steps.meta.outputs.tag == 'dev-latest' }}
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const tag = 'dev-latest';
            // delete release if exists
            try {
              const rel = await github.rest.repos.getReleaseByTag({ owner, repo, tag });
              await github.rest.repos.deleteRelease({ owner, repo, release_id: rel.data.id });
            } catch (e) { /* ignore if not exists */ }
            // delete tag ref if exists
            try {
              await github.rest.git.deleteRef({ owner, repo, ref: `tags/${tag}` });
            } catch (e) { /* ignore if not exists */ }

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.name }}
          prerelease: ${{ steps.meta.outputs.prerelease }}
          files: |
            artifacts/**/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
